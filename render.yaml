databases:
  - name: careconnect-db
    databaseName: careconnect_db
    user: careconnect_user
    plan: free

services:
  - type: web
    name: careconnect
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && cd server && npm install && npm run db:migrate && npm run db:seed
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
